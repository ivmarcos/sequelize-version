version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sequelize-version-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sequelize_version_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: sequelize-version-test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PWD: postgres
      DB_TEST: sequelize_version_test
    volumes:
      - ./coverage:/app/coverage
